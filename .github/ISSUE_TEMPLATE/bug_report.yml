name: Bug report
description: Something isn't working as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Found a security problem? Please don't file it here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Settings → Branding
        2. Change the colour
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Deploying with the Deploy to Cloudflare button
        - Signing in
        - The dashboard
        - Short link redirects
        - Importing links
        - Running locally
        - Somewhere else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of Settings in your dashboard.
      placeholder: "1.0.0"
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: From your browser console or the Worker's logs in the Cloudflare dashboard. Remove any emails, passwords or secrets first.
      render: text
